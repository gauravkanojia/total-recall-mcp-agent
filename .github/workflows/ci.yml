name: CI

on: [push, pull_request]

defaults:
  run:
    working-directory: total-recall-mcp-agent

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: cockroachdb+asyncpg://root@localhost:26257/total_recall_mcp_db
      DATABASE_NAME: total_recall_mcp_db
      EMBEDDING_PROVIDER: fake
      HTTP_AUTH_MODE: "off"
      DATABASE_USE_NULLPOOL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Start CockroachDB
        run: |
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:v26.2.3 start-single-node --insecure
          for i in $(seq 1 30); do
            docker exec crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec crdb ./cockroach sql --insecure \
            -e "CREATE DATABASE IF NOT EXISTS total_recall_mcp_db"
      - name: Migrate schema
        run: uv run alembic upgrade head
      - name: Seed test data
        run: uv run python scripts/seed.py
      - name: Pytest
        run: uv run pytest

  secret-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
