version: "3.9"

services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.3
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data

  mcp-agent:
    build: .
    ports:
      - "4646:8080"
    command:
      [
        "uv",
        "run",
        "total-recall-mcp-agent",
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    environment:
      DATABASE_URL: cockroachdb+asyncpg://root@cockroach:26257/total_recall_mcp_db
      DATABASE_NAME: total_recall_mcp_db
      EMBEDDING_PROVIDER: fake
      AWS_REGION: us-east-1
    depends_on:
      - cockroach

volumes:
  cockroach-data:
