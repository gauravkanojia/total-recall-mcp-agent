[project]
name = "total-recall-mcp"
version = "0.1.0"
description = "I'll be back with your requests..."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "mcp",
    "python-jose[cryptography]",
    "boto3",
    "pydantic-settings",
    "alembic>=1.18.5",
    "structlog>=26.1.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
