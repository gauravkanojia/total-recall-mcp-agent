[project]
name = "total-recall-mcp"
version = "0.1.0"
description = "[I'll be back] with responses for your requests..."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "mcp",
    "python-jose[cryptography]",
    "boto3",
    "pydantic-settings",
    "alembic>=1.18.5",
    "structlog>=26.1.0",
    "python-dotenv>=1.2.2",
    "greenlet>=3.5.3",
    "sqlalchemy-cockroachdb>=2.0.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]